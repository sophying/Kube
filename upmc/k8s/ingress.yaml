apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upmc-ingress
  namespace: push
spec:
  rules:
    - host: upmc.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: upmc-svc
                port:
                  number: 8080
